user root root;
daemon off;
master_process off;
worker_processes 1;
pid /home/user/interspec-typed-allocator/evaluation/results/tracker/I4/01-tests-before-implementation-dc664f9/gate/rlbox-only-w0/nginx.pid;
error_log stderr notice;
env INTERSPEC_TRACE;
env INTERSPEC_POINTER_CENSUS;
env INTERSPEC_NGINX_FAULT_PATH;
env INTERSPEC_NGINX_FAULT_KIND;
events { worker_connections 2048; }
http {
  access_log off;
  map $uri $mapped { default "other"; ~^/map/([a-z]+)$ $1; }
  server {
    listen 127.0.0.1:41593;
    location = /health { return 200 "ready"; }
    location ~ ^/unused0/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused1/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused2/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused3/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused4/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused5/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused6/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused7/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused8/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused9/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused10/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused11/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused12/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused13/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused14/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
location ~ ^/unused15/([a-z]+)/([0-9]+)$ { return 200 "unused"; }
    location ~ ^/items/(?<itemid>[0-9]+)/(?<slug>[a-z]+)$ { return 200 "item:$itemid:$slug"; }
    location ~* ^/case/([a-z]+)$ { return 200 "case:$1"; }
    location ~ ^/optional/(a)?(b)$ { return 200 "optional:$1:$2"; }
    location /rewrite/ { rewrite ^/rewrite/([a-z]+)$ /target/$1 last; }
    location ~ ^/target/([a-z]+)$ { return 200 "rewrite:$1"; }
    location /map/ { return 200 "map:$mapped"; }
    location / { return 404 "missing"; }
  }
}
