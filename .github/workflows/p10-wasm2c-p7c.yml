name: p10-wasm2c-p7c

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  p7c-wasm2c:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake build-essential ca-certificates git python3
      - uses: actions/checkout@v4
      - name: Run P7c boundaries on RLBox wasm2c
        run: |
          set -o pipefail
          chmod +x ./scripts/run_p7c_wasm2c.sh
          ./scripts/run_p7c_wasm2c.sh 2>&1 | tee /tmp/interspec-p7c-wasm2c.log
      - name: Upload P7c wasm2c diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7c-wasm2c-diagnostics
          if-no-files-found: ignore
          path: /tmp/interspec-p7c-wasm2c.log
