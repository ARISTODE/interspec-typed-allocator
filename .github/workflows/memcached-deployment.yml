name: memcached-deployment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify evidence validator rejects incomplete or corrupted data
        run: python3 tests/memcached_matrix_evidence.py
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake build-essential ca-certificates git python3 \
            libevent-dev libio-socket-inet6-perl
      - name: Build all server variants
        run: bash scripts/build_memcached_deployment.sh
      - name: Validate actual server and source-corruption paths
        run: python3 tools/test_memcached_deployment.py --out memcached-results/correctness
      - name: Exercise performance collection
        run: |
          python3 tools/benchmark_memcached.py \
            --out memcached-results/performance --seconds 1 --warmup 0.3 \
            --repetitions 3 --label hosted_ci_reference \
            --correctness-summary memcached-results/correctness/summary.json
      - name: Collect all four variants in the same six scenario experiment
        run: |
          python3 tools/benchmark_memcached_matrix.py \
            --out memcached-results/overhead-matrix --preset smoke --include-tracking \
            --repetitions 5 --seconds 3 --warmup 1 \
            --correctness-summary memcached-results/correctness/summary.json \
            --label hosted_ci_matrix
      - name: Independently validate every matrix sample and summary
        run: |
          python3 tools/verify_memcached_matrix.py \
            --matrix memcached-results/overhead-matrix \
            --correctness-summary memcached-results/correctness/summary.json
      - name: Profile SP3 check frequency
        run: |
          python3 tools/profile_memcached_checks.py \
            --out memcached-results/check-frequency --operations 1000 --key-cap 512 \
            --correctness-summary memcached-results/correctness/summary.json
      - name: Run SP3 primitive microbenchmarks
        run: |
          python3 tools/run_runtime_microbench.py \
            --out memcached-results/runtime-microbench \
            --repetitions 5 --iterations 200000
      - name: Render correlated performance report
        run: |
          python3 tools/render_memcached_overhead_study.py \
            --matrix memcached-results/overhead-matrix/final-summary.json \
            --checks memcached-results/check-frequency/check-frequency.json \
            --microbench memcached-results/runtime-microbench/summary.json \
            --output memcached-results/PERFORMANCE_STUDY.md
      - name: Upload results and build provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memcached-deployment-evidence
          if-no-files-found: ignore
          path: |
            memcached-results
            /tmp/interspec-memcached-deployment/logs
            /tmp/interspec-memcached-deployment/build-manifest.json
