name: nginx-deployment

on:
  push:
    paths:
      - 'integration/nginx_server/**'
      - 'tools/*nginx*.py'
      - 'scripts/build_nginx_deployment.sh'
      - 'backends/rlbox_wasm2c/**'
      - 'include/interspec/**'
      - '.github/workflows/nginx-deployment.yml'
  pull_request:
    paths:
      - 'integration/nginx_server/**'
      - 'tools/*nginx*.py'
      - 'scripts/build_nginx_deployment.sh'
      - 'backends/rlbox_wasm2c/**'
      - 'include/interspec/**'
      - '.github/workflows/nginx-deployment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-deployment-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git python3 libcrypt-dev wrk
      - name: Build actual nginx server variants
        run: bash scripts/build_nginx_deployment.sh
      - name: Validate application, corruption, workers, and reload
        run: python3 tools/test_nginx_deployment.py --out nginx-results/correctness --workers 2
      - name: Collect full workload reference
        run: |
          python3 tools/benchmark_nginx.py --out nginx-results/performance \
            --correctness nginx-results/correctness/summary.json \
            --seconds 30 --repetitions 5 --warmup-seconds 3 --threads 4 8 --connections 100
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-deployment-evidence
          if-no-files-found: ignore
          path: |
            nginx-results
            /tmp/interspec-nginx-deployment/logs
            /tmp/interspec-nginx-deployment/build-manifest.json
