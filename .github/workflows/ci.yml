name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run P8 deterministic and runtime evaluation
        env:
          INTERSPEC_BENCH_ITERATIONS: 100000
        run: bash ./scripts/run_p8_evaluation.sh p8-results
      - name: Upload P8 evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: p8-evaluation-results
          path: p8-results

  p9c-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile P9c paper SP3 coverage
        run: bash ./scripts/run_p9c_evaluation.sh p9c-results
      - name: Upload P9c SP3 coverage reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: p9c-sp3-coverage-results
          path: p9c-results

  release-smoke:
    needs:
      - evaluation
      - p9c-coverage
      - rlbox-nacl
      - rlbox-wasm2c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download P8 deterministic evidence
        uses: actions/download-artifact@v4
        with:
          name: p8-evaluation-results
          path: p8-results
      - name: Download P8 RLBox evidence
        uses: actions/download-artifact@v4
        with:
          name: p8-rlbox-results
          path: p8-rlbox-results
      - name: Build installable research preview
        env:
          INTERSPEC_P8_EVAL_DIR: ${{ github.workspace }}/p8-results
          INTERSPEC_P8_RLBOX_DIR: ${{ github.workspace }}/p8-rlbox-results
        run: bash ./scripts/package_release.sh dist
      - name: Upload research preview archive
        uses: actions/upload-artifact@v4
        with:
          name: interspec-typed-allocator-0.1.0
          path: |
            dist/interspec-typed-allocator-0.1.0.tar.gz
            dist/interspec-typed-allocator-0.1.0.tar.gz.sha256

  policy-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: codeql
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
      - name: Infer runtime policy with CodeQL
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_policy_inference.sh
          ./scripts/run_policy_inference.sh
      - name: Infer P4 rsync popt policy from real source
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_rsync_popt_policy_inference.sh
          ./scripts/run_rsync_popt_policy_inference.sh
      - name: Infer P7c memcached bipbuffer policy from real source
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_memcached_bipbuffer_policy_inference.sh
          ./scripts/run_memcached_bipbuffer_policy_inference.sh
      - name: Infer P7c nginx libpcre policy from real source
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_nginx_libpcre_policy_inference.sh
          ./scripts/run_nginx_libpcre_policy_inference.sh
      - name: Infer P7c yaml libyaml policy from real source
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_yaml_libyaml_policy_inference.sh
          ./scripts/run_yaml_libyaml_policy_inference.sh

  rlbox-nacl:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 45
    env:
      INTERSPEC_P8_BOUNDARY_ITERATIONS: 20000
      INTERSPEC_P8_APP_REPETITIONS: 9
      INTERSPEC_P9A_APP_REPETITIONS: 9
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake build-essential ca-certificates cmake cargo curl \
            g++-multilib gawk git libpopt-dev python2 python3 util-linux
      - uses: actions/checkout@v4
      - name: Run RLBox NaCl, P4c, P7c, P8, and P9a measurements
        run: |
          chmod +x ./scripts/run_rlbox_nacl_poc.sh \
            ./scripts/run_yaml_libyaml_rlbox_extension.sh \
            ./scripts/write_p8_rlbox_environment.sh \
            ./scripts/run_p8_rlbox_evaluation.sh \
            ./scripts/collect_p9a_rlbox_results.sh
          ./scripts/run_p8_rlbox_evaluation.sh p8-rlbox-results
          ./scripts/collect_p9a_rlbox_results.sh p9a-rlbox-results
      - name: Upload P8 RLBox measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8-rlbox-results
          if-no-files-found: ignore
          path: p8-rlbox-results
      - name: Upload P9a RLBox-only baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9a-rlbox-only-results
          if-no-files-found: ignore
          path: p9a-rlbox-results

  rlbox-wasm2c:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake build-essential ca-certificates git libpopt-dev python3
      - uses: actions/checkout@v4
      - name: Run P9b RLBox wasm2c integration
        run: |
          set -o pipefail
          chmod +x ./scripts/run_rlbox_wasm2c_poc.sh
          ./scripts/run_rlbox_wasm2c_poc.sh 2>&1 | tee /tmp/interspec-p9b-wasm2c.log
      - name: Upload P9b wasm2c diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9b-wasm2c-diagnostics
          if-no-files-found: ignore
          path: /tmp/interspec-p9b-wasm2c.log
