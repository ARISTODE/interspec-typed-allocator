name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run P6 security and runtime evaluation
        env:
          INTERSPEC_BENCH_ITERATIONS: 100000
        run: bash ./scripts/run_p6_evaluation.sh p6-results
      - name: Upload P6 evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: p6-evaluation-results
          path: p6-results

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable research preview
        run: bash ./scripts/package_release.sh dist
      - name: Upload research preview archive
        uses: actions/upload-artifact@v4
        with:
          name: interspec-typed-allocator-0.1.0
          path: |
            dist/interspec-typed-allocator-0.1.0.tar.gz
            dist/interspec-typed-allocator-0.1.0.tar.gz.sha256

  policy-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: codeql
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
      - name: Infer runtime policy with CodeQL
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_policy_inference.sh
          ./scripts/run_policy_inference.sh
      - name: Infer P4 rsync popt policy from real source
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_rsync_popt_policy_inference.sh
          ./scripts/run_rsync_popt_policy_inference.sh
      - name: Infer P7c memcached bipbuffer policy from real source
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_memcached_bipbuffer_policy_inference.sh
          ./scripts/run_memcached_bipbuffer_policy_inference.sh
      - name: Infer P7c nginx libpcre policy from real source
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_nginx_libpcre_policy_inference.sh
          ./scripts/run_nginx_libpcre_policy_inference.sh
      - name: Infer P7c yaml libyaml policy from real source
        run: |
          export PATH="$(dirname '${{ steps.codeql.outputs.codeql-path }}'):$PATH"
          chmod +x ./scripts/run_yaml_libyaml_policy_inference.sh
          ./scripts/run_yaml_libyaml_policy_inference.sh

  rlbox-nacl:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake build-essential ca-certificates cmake cargo curl \
            g++-multilib gawk git libpopt-dev python2 python3
      - uses: actions/checkout@v4
      - run: chmod +x ./scripts/run_rlbox_nacl_poc.sh ./scripts/run_yaml_libyaml_rlbox_extension.sh
      - name: Run RLBox NaCl, P4c, and P7c integrations
        run: |
          log=/tmp/interspec-rlbox-nacl-ci.log
          if ! ./scripts/run_rlbox_nacl_poc.sh >"$log" 2>&1; then
            echo "RLBox NaCl / P4c / P7c base integration failed; final log follows"
            tail -n 300 "$log"
            exit 1
          fi
          tail -n 100 "$log"

          yaml_log=/tmp/interspec-yaml-libyaml-ci.log
          if ! INTERSPEC_P8_BOUNDARY_EVIDENCE=/tmp/p8-boundary-security.csv \
              ./scripts/run_yaml_libyaml_rlbox_extension.sh >"$yaml_log" 2>&1; then
            echo "P7c yaml/libyaml extension failed; final log follows"
            tail -n 300 "$yaml_log"
            exit 1
          fi
          tail -n 120 "$yaml_log"
      - name: Upload P7c integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7c-integration-diagnostics
          if-no-files-found: ignore
          path: |
            /tmp/interspec-rlbox-nacl-ci.log
            /tmp/interspec-yaml-libyaml-ci.log
            /tmp/p8-boundary-security.csv
      - name: Upload P8 boundary security evidence
        uses: actions/upload-artifact@v4
        with:
          name: p8-boundary-evidence
          path: /tmp/p8-boundary-security.csv

  paper-evaluation:
    needs: rlbox-nacl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download RLBox boundary evidence
        uses: actions/download-artifact@v4
        with:
          name: p8-boundary-evidence
          path: p8-input
      - name: Run P8 paper evaluation
        env:
          INTERSPEC_BENCH_ITERATIONS: 100000
          INTERSPEC_P8_REPETITIONS: 5
          INTERSPEC_P8_BOUNDARY_EVIDENCE: p8-input/p8-boundary-security.csv
          INTERSPEC_P8_REQUIRE_BOUNDARY_EVIDENCE: 1
        run: bash ./scripts/run_p8_evaluation.sh p8-results
      - name: Upload P8 paper evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: p8-paper-evaluation-results
          path: p8-results
