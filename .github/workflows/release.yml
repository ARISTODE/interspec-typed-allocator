name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  p8-evidence:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 45
    env:
      INTERSPEC_BENCH_ITERATIONS: 100000
      INTERSPEC_P8_BOUNDARY_ITERATIONS: 20000
      INTERSPEC_P8_APP_REPETITIONS: 9
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake build-essential ca-certificates cmake cargo curl \
            g++-multilib gawk git libpopt-dev python2 python3 util-linux
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate deterministic P8 evidence
        run: bash ./scripts/run_p8_evaluation.sh p8-results
      - name: Generate RLBox + NaCl P8 evidence
        run: |
          chmod +x ./scripts/run_rlbox_nacl_poc.sh \
            ./scripts/run_yaml_libyaml_rlbox_extension.sh \
            ./scripts/write_p8_rlbox_environment.sh \
            ./scripts/run_p8_rlbox_evaluation.sh
          ./scripts/run_p8_rlbox_evaluation.sh p8-rlbox-results
      - name: Upload P8 deterministic evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-p8-evaluation-results
          path: p8-results
      - name: Upload P8 RLBox evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-p8-rlbox-results
          path: p8-rlbox-results

  p9b-wasm2c:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake build-essential ca-certificates git libpopt-dev python3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate P9b RLBox wasm2c integration
        run: |
          set -o pipefail
          chmod +x ./scripts/run_rlbox_wasm2c_poc.sh
          ./scripts/run_rlbox_wasm2c_poc.sh 2>&1 | tee /tmp/interspec-p9b-wasm2c-release.log
      - name: Upload P9b wasm2c diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-p9b-wasm2c-diagnostics
          if-no-files-found: ignore
          path: /tmp/interspec-p9b-wasm2c-release.log

  p10-wasm2c-p7c:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            autoconf automake build-essential ca-certificates git python3
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate P10 P7c boundaries on RLBox wasm2c
        run: |
          set -o pipefail
          chmod +x ./scripts/run_p7c_wasm2c.sh
          ./scripts/run_p7c_wasm2c.sh 2>&1 | tee /tmp/interspec-p10-wasm2c-release.log
      - name: Upload P10 wasm2c diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-p10-wasm2c-diagnostics
          if-no-files-found: ignore
          path: /tmp/interspec-p10-wasm2c-release.log

  release:
    needs:
      - p8-evidence
      - p9b-wasm2c
      - p10-wasm2c-p7c
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "project(interspec_typed_allocator VERSION ${version} LANGUAGES CXX)" CMakeLists.txt; then
            echo "tag ${GITHUB_REF_NAME} does not match the CMake project version"
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "release tag must point at the current main branch head"
            exit 1
          fi
          echo "INTERSPEC_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Download P8 deterministic evidence
        uses: actions/download-artifact@v4
        with:
          name: release-p8-evaluation-results
          path: p8-results
      - name: Download P8 RLBox evidence
        uses: actions/download-artifact@v4
        with:
          name: release-p8-rlbox-results
          path: p8-rlbox-results

      - name: Build release archive
        env:
          INTERSPEC_P8_EVAL_DIR: ${{ github.workspace }}/p8-results
          INTERSPEC_P8_RLBOX_DIR: ${{ github.workspace }}/p8-rlbox-results
        run: bash ./scripts/package_release.sh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/interspec-typed-allocator-${INTERSPEC_RELEASE_VERSION}.tar.gz" \
            "dist/interspec-typed-allocator-${INTERSPEC_RELEASE_VERSION}.tar.gz.sha256" \
            --title "InterSpec Typed Allocator ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
